---
- name: push public key
  hosts: all
  gather_facts: no
  tasks:
    - name: mkdir /root/.ssh
      file:
        path: /root/.ssh/
        state: directory
        mode: '0700'

    - name: touch file authorized_keys
      file:
        path: /root/.ssh/authorized_keys
        state: touch
        mode: '0600'

    - name: copy pubkey
      blockinfile: 
        mode: 0600
        path: /root/.ssh/authorized_keys 
        block: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMQh/SCNQjGHj+y8sSpBIYb1g27U+ek/5V0GX8MvPle6 keyman@MacBook-Pro.local"
          #        block: "ssh-rsa  root@jumpserver"
