---
- name: install vmctl
  hosts: all
  gather_facts: no
  vars:
    #- rht_file: 'http://172.31.0.242:17242/vm/stream9/stream9-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/ex/ex-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/openstackz/openstackz-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/openstacka/openstacka-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/openstacky/openstacky-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/httpd/httpd-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/centos7/centos7-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/rhcsa9/rhcsa9-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/rhce9/rhce9-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/k8s27u/k8s27u-rht'
    #- rht_file: 'http://172.31.0.242:17242/vm/k8s28c/k8s28c-rht'
