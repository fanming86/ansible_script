    #- rht_file: 'http://172.31.0.242:17242/vm/cephs/cephs-rht'
  tasks:
    - name: yum install vmctl
      yum:
        name: 'http://172.31.0.242:17242/vmctl-v4-3.el9.x86_64.rpm'
        state: installed
        disable_gpg_check: yes

    - name: copy rhtfile
      get_url:
        url: '{{ rht_file }}'
        dest: /etc/rht
          #dest: "/opt/"

    - name: start vm
      #shell: "yes | vmctl reset all"
      #shell: "yes | vmctl poweroff all"
      #command: "vmctl stop all"
      #command: "vmctl status all"
      command: "vmctl start all"
      #command: "vmctl stop all -f /opt/stream9-rht "

