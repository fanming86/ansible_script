---
- name: install vmctl
  hosts: all
  gather_facts: no
  vars:
    - rht_file: 'http://172.31.0.242:17242/vm/rhcsa9/rhcsa9-rht'
  tasks:
    - name: yum install vmctl
      yum:
        name: 'http://172.31.0.242:17242/vmctl-v4-3.el9.x86_64.rpm'
        state: installed
        disable_gpg_check: yes

    - name: copy rhtfile
      get_url:
        url: '{{ rht_file }}'
        dest: '/opt/rhcsa9-rht'

    - name: start vm
      command: "vmctl start all -f /opt/rhcsa9-rht"
        #shell: "yes | vmctl remove all -f /opt/rhcsa9-rht"

